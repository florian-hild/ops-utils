---
name: Bash Lint
run-name: Bash Lint

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
    paths:
      - .github/workflows/bash-lint.yml
      - bash/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: florian-hild/reusable-workflows/.github/workflows/shell-lint.yml@v2
    with:
      check_format: true
      paths: bash
