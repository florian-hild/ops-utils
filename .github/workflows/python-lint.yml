---
name: Python Lint
run-name: Python Lint

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
    paths:
      - .github/workflows/python-lint.yml
      - python/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.join.outputs.changed || '[]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One group per tracked directory holding a pyproject.toml, so a new
      # python/bin/<name>/ project is picked up without touching this file.
      - name: Find python projects
        id: find
        shell: bash
        run: |
          set -euo pipefail

          # Tracked files only, so untracked local junk never becomes a group.
          mapfile -t projects < <(
            git ls-files -- python/ |
              while IFS= read -r file; do
                if [[ "${file##*/}" == "pyproject.toml" ]]; then
                  printf '%s\n' "${file%/*}"
                fi
              done | sort -u
          )

          if [[ "${#projects[@]}" -eq 0 ]]; then
            echo "::warning::No python projects found under python/"
            echo "projects=[]" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Found ${#projects[@]} python project(s):"
          printf '  %s\n' "${projects[@]}"

          # Group keys stay p0..pN so the path-changes outputs remain valid
          # identifiers; the join step maps them back to directories.
          projects_json="$(printf '%s\n' "${projects[@]}" | jq -R . | jq -sc .)"
          paths_json="$(
            printf '%s\n' "${projects[@]}" | jq -R . | jq -sc \
              'to_entries | map({key: ("p" + (.key | tostring)), value: [(.value + "/**")]}) | from_entries'
          )"

          echo "projects=${projects_json}" >> "${GITHUB_OUTPUT}"
          echo "paths=${paths_json}" >> "${GITHUB_OUTPUT}"

      # Manual runs have no base to diff against, so every group counts as
      # changed there and the whole tree is linted.
      - name: Detect changed projects
        id: changes
        if: steps.find.outputs.projects != '[]'
        uses: florian-hild/actions/path-changes@v2
        with:
          paths: ${{ steps.find.outputs.paths }}

      - name: Join changed projects
        id: join
        if: steps.find.outputs.projects != '[]'
        shell: bash
        env:
          PROJECTS: ${{ steps.find.outputs.projects }}
          RESULTS: ${{ steps.changes.outputs.results }}
        run: |
          set -euo pipefail

          changed="$(
            jq -cn --argjson projects "${PROJECTS}" --argjson results "${RESULTS}" \
              '[$projects | to_entries[] | select($results[("p" + (.key | tostring))]) | .value]'
          )"

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "Changed project(s): ${changed}"

  lint:
    name: Lint
    needs: discover
    if: needs.discover.outputs.changed != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.changed) }}
    uses: florian-hild/reusable-workflows/.github/workflows/python-lint.yml@v2
    with:
      check_format: true
      working_directory: ${{ matrix.project }}
