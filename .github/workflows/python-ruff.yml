# Lint Python files under python/ using ruff
name: Python — ruff lint
run-name: Python — ruff lint

on:
  push:
    branches:
      - 'main'
    paths:
      - 'python/**'
      - '.github/workflows/python-ruff.yml'
  pull_request:
    types: [opened, reopened, ready_for_review, synchroniye]
    paths:
      - 'python/**'
      - '.github/workflows/python-ruff.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ruff (check)
        uses: astral-sh/ruff-action@v3
        with:
          version: latest
          src: "./python"
