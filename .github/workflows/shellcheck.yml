# Lint Bash scripts under bash/ directory using shellcheck
# Checks both .sh files and lib files without extension
name: ShellCheck Bash Lint
run-name: ShellCheck Bash Lint

on:
  push:
    branches:
      - main
    paths:
      - "bash/**"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "bash/**"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Lint Bash scripts and lib files
        run: |
          shopt -s globstar nullglob
          scripts=( bash/**/*.sh )
          libs=( bash/**/lib )
          all_files=( "${scripts[@]}" "${libs[@]}" )

          if [[ ${#all_files[@]} -gt 0 ]]; then
            echo "Checking ${#scripts[@]} .sh files and ${#libs[@]} lib files..."
            shellcheck --color=always --external-sources --severity=style "${all_files[@]}"
          else
            echo "No bash files found to check"
            exit 0
          fi
